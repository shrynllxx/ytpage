   <!-- Todo -->

      </div>

  <!-- Popup -->
   <div id="popup" class="popup">
      <div class="popup-content">
          <p>Add Lesson</p>
          <span class="close" onclick="closePopup()">&times;</span>
          <input type="text" id="lesson-title" placeholder="Lesson Title" />
          <input type="text" id="lesson-description" placeholder="Lesson Description" />
          <input type="file" id="lesson-image" accept="image/*" />
          <!-- <input type="file" id="lesson-file" accept="document/*"/> -->
          <button onclick="addLesson()">Submit</button>

      </div>
  </div>
  
  
  
  
  
  <footer>

  <script>
    function openPopup() {
    document.getElementById("popup").style.display = "block";
}


function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function del(){
    document.getElementById("popup-todo").style.display="none";

}

function addLesson() {

    const title = document.getElementById("lesson-title").value.trim();
    const description = document.getElementById("lesson-description").value.trim();
    const imageInput = document.getElementById("lesson-image");
    const imageFile = imageInput.files[0];

    if (title === "" || description === "" || !imageFile) {
        alert("Please fill in all fields and select an image.");
        return;
    }

    const classCards = document.getElementById("class-cards");
    const newCardButton = document.createElement("button");
    newCardButton.className = "class-card";


    const reader = new FileReader();
    reader.onload = function (event) {
        newCardButton.innerHTML = `
            <img src="${event.target.result}" alt="Lesson Image">
            <h3>${title}</h3>
            <p>${description}</p>
        `;
        classCards.appendChild(newCardButton);

        newCardButton.onclick = function () {
            window.location.href = "les1.html";
        };
    };
    reader.readAsDataURL(imageFile);

    document.getElementById("lesson-title").value = "";
    document.getElementById("lesson-description").value = "";
    imageInput.value = "";
    closePopup();
};
    const logoutButton = document.getElementById('logoutButton');

    logoutButton.addEventListener('click', function() {
       
        const confirmLogout = confirm("Are you sure you want to log out?");
        if (confirmLogout) {
                 window.location.href = "login.html"; 
        } else {
            console.log("Log out canceled");
        }
    });

    const textInput = document.createElement("input");
            textInput.type = "text";
            textInput.placeholder = "Task Description";

            
            const deleteButton = document.createElement("button");
            deleteButton.innerHTML = "x";
            deleteButton.onclick = function () {
                newEntry.remove();
            };

           
            newEntry.appendChild(checkbox);
            newEntry.appendChild(textInput);
            newEntry.appendChild(deleteButton);
            todoWidget.appendChild(newEntry);
      
</script>
